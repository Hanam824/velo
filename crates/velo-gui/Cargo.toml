[package]
name = "velo-gui"
description = "Velo Download Manager desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "velo"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
velo-core.workspace = true
velo-engine.workspace = true
velo-extract.workspace = true
velo-ipc.workspace = true
velo-platform.workspace = true
velo-store.workspace = true
slint.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
# Must match the slint version: runs the UI without a window system.
i-slint-backend-testing = "=1.18.1"
# For the snapshot test: the software renderer with system fonts draws windows into PNG files.
png = "0.18"
slint = { workspace = true, features = ["software-renderer-systemfonts"] }
tempfile.workspace = true

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true

# Installers, built by `cargo packager -p velo-gui --release` (scripts/package-release.sh).
[package.metadata.packager]
product-name = "Velo Download Manager"
identifier = "io.github.hanam824.velo"
description = "A segmented download manager"
homepage = "https://github.com/Hanam824/velo"
authors = ["Velo contributors"]
publisher = "Velo contributors"
category = "Utility"
icons = [
    "../../packaging/icons/velo-32.png",
    "../../packaging/icons/velo-128.png",
    "../../packaging/icons/velo-256.png",
    "../../packaging/icons/velo-512.png",
    "../../packaging/icons/velo-512@2x.png",
]
binaries = [
    { path = "velo", main = true },
    { path = "velo-cli", main = false },
    { path = "velo-nmh", main = false },
]
out-dir = "../../dist/installers"
# The release binaries come from package-release.sh, which builds both before packaging.
before-packaging-command = "cargo build --release -p velo-gui -p velo-cli -p velo-nmh"

[package.metadata.packager.macos]
minimum-system-version = "15.0"

[package.metadata.packager.deb]
section = "net"
# The Slint window's libraries; the rest is in glibc.
depends = ["libfontconfig1", "libxkbcommon0"]

[package.metadata.packager.nsis]
# Per user, so installing needs no administrator rights.
installer-mode = "currentUser"
