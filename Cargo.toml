[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
# Velo ships as an app, not on crates.io; cargo-deny also needs this to accept path dependencies.
publish = false

[workspace.dependencies]
velo-core = { path = "crates/velo-core" }
velo-engine = { path = "crates/velo-engine" }
velo-ipc = { path = "crates/velo-ipc" }
velo-platform = { path = "crates/velo-platform" }
velo-store = { path = "crates/velo-store" }

slint = "1.18"
slint-build = "1.18"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
