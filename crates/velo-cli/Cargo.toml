[package]
name = "velo-cli"
description = "Velo command-line front-end"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "velo-cli"
path = "src/main.rs"

[dependencies]
clap.workspace = true
thiserror.workspace = true
velo-core.workspace = true
velo-engine.workspace = true
velo-ipc.workspace = true
velo-platform.workspace = true
velo-store.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
