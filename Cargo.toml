[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
# Velo ships as an app, not on crates.io; cargo-deny also needs this to accept path dependencies.
publish = false

[workspace.dependencies]
velo-core = { path = "crates/velo-core" }
velo-engine = { path = "crates/velo-engine" }
velo-ipc = { path = "crates/velo-ipc" }
velo-platform = { path = "crates/velo-platform" }
velo-store = { path = "crates/velo-store" }

axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3", default-features = false }
percent-encoding = "2"
proptest = "1"
# rustls with the ring provider: the default aws-lc provider carries the OpenSSL license, which deny.toml doesn't allow.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
slint = "1.18"
slint-build = "1.18"
tempfile = "3"
thiserror = "2"
tokio = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
