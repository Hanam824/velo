[package]
name = "velo-engine"
description = "Velo segmented download engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
velo-core.workspace = true
velo-log.workspace = true
velo-mux.workspace = true
velo-platform.workspace = true
axum = { workspace = true, optional = true }
base64.workspace = true
jiff.workspace = true
futures-util = { workspace = true, optional = true }
percent-encoding.workspace = true
reqwest.workspace = true
rustls.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[features]
# A local HTTP server for tests (velo_engine::testing).
testing = ["dep:axum", "dep:futures-util", "tokio/net", "tokio/rt-multi-thread"]

[dev-dependencies]
velo-engine = { path = ".", features = ["testing"] }
velo-mux = { workspace = true, features = ["testing"] }
proptest.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
