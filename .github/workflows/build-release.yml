name: Build release archives

# Builds and tests one commit natively on every release platform and uploads an archive and the
# installers per platform (artifacts `velo-<platform>`), after installing them once to check they
# work. Called by release.yml and nightly-release.yml, which then publish them.
on:
  workflow_call:
    inputs:
      version:
        description: "Version written into the build and the archive names, e.g. v0.2.0"
        required: true
        type: string
      sha:
        description: "Commit to build"
        required: true
        type: string
  # By hand (Actions → Build release archives → Run workflow), to try the packaging on a branch
  # without publishing anything.
  workflow_dispatch:
    inputs:
      version:
        description: "Version written into the build and the archive names, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The browser extension, zipped once per browser for loading or submitting to a store
  # (artifact `velo-extension`). The same for every platform.
  extension:
    name: Build the browser extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Build and zip
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/package-extension.sh "$VERSION"

      - name: Upload the extension
        uses: actions/upload-artifact@v7
        with:
          name: velo-extension
          path: dist/velo-*-extension-*.zip
          if-no-files-found: error

  # The Safari app that carries the extension (artifact `velo-safari-extension`), for Apple
  # Silicon and Intel in one app.
  safari:
    name: Build the Safari extension
    runs-on: macos-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Build and zip
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/build-safari.sh "$VERSION"

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: velo-safari-extension
          path: dist/velo-*-safari-extension-macos.zip
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux-x86_64
          - runner: macos-latest
            name: macos-arm64
          - runner: macos-15-intel # GitHub's Intel macOS runner
            name: macos-x86_64
          - runner: windows-latest
            name: windows-x86_64
          - runner: windows-11-arm # GitHub's Windows ARM64 runner
            name: windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash # Git Bash on Windows, for package-release.sh
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          # A dispatch has no sha input and builds the branch it runs on.
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Same shared key as CI: this runs on main, and pull requests can restore caches saved on
      # main, so new pull requests start with the dependencies already compiled.
      - name: Build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Install Slint system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Test
        run: cargo test --workspace --locked

      - name: Build the archive and the installers
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/package-release.sh "$VERSION" --installers

      - name: Install and run the installed app's CLI
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/smoke-install.sh "$VERSION"

      - name: Upload the archive and the installers
        uses: actions/upload-artifact@v7
        with:
          name: velo-${{ matrix.name }}
          path: |
            dist/velo-*.tar.gz
            dist/velo-*.zip
            dist/velo-*.dmg
            dist/velo-*.exe
            dist/velo-*.deb
            dist/velo-*.AppImage
          if-no-files-found: error
