# cargo-deny configuration, checked by the `Dependencies` job in .github/workflows/ci.yml.
# Run locally with `cargo deny check` (install: `cargo install cargo-deny --locked`).

[graph]
all-features = true

[advisories]
# RustSec advisories are errors; an unmaintained crate is reported only when we depend on it directly.
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses only, plus Slint's royalty-free license for desktop apps. Using Slint under
# that license requires showing its attribution (the `AboutSlint` widget or the "Made with Slint"
# badge) in the app, which the About dialog does.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    # Public-domain-equivalent, like CC0 and Unlicense (used by interprocess's helpers).
    "0BSD",
    "LicenseRef-Slint-Royalty-free-2.0",
]
confidence-threshold = 0.9

# Mozilla's CA root list, as data. rustls-platform-verifier uses it only on targets without a
# system trust store (none of ours), but cargo-deny checks every target.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
# Slint, winit and the platform crates pull in several versions of some crates; report, don't fail.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version; that's fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
